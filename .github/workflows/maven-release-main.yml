# Builds the PGP signed update site of a release, tags the release and provides the update site as workflow artifact.
# Publishing on www.jeaf-generator.io is done manually (see README.md).

name: Maven Release Build

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g. 2.3.0, current version without -SNAPSHOT)'
        required: true
        type: string
      tagName:
        description: 'Release tag (e.g. v2.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed update site
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
      TAG_NAME: ${{ inputs.tagName }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Check release version
      run: |
        PROJECT_VERSION=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
        if [ "$PROJECT_VERSION" != "$RELEASE_VERSION-SNAPSHOT" ]; then
          echo "::error::Release version $RELEASE_VERSION doesn't match project version $PROJECT_VERSION"
          exit 1
        fi

    - name: Install virtual display
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build signed update site
      env:
        MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: |
        KEY_FILE="$RUNNER_TEMP/signing-key.asc"
        printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" > "$KEY_FILE"
        xvfb-run -a mvn -Duser.country=DE -Duser.language=de -Duser.timezone=Europe/Berlin -B clean verify -PJEAFRelease -Dtycho.pgp.signer.bc.secretKeys="$KEY_FILE"
        rm -f "$KEY_FILE"

    - name: Tag release
      run: |
        git config user.name "JEAF Development Team"
        git config user.email "jeaf@anaptecs.de"
        git tag -a "$TAG_NAME" -m "Release $RELEASE_VERSION"
        git push origin "$TAG_NAME"

    - name: Provide update site
      uses: actions/upload-artifact@v4
      with:
        name: jeaf-xpand-eclipse-${{ inputs.releaseVersion }}
        path: site/target/repository
        if-no-files-found: error
